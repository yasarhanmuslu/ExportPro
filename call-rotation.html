<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <script>/* Flash önle */ (function(){var t=localStorage.getItem('ep-theme')||'light';document.documentElement.classList.add(t==='dark'?'dark':'light');})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günlük Arama Listesi — Export Suite</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="./src/assets/css/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --porc-bg:      var(--surface-2, #F6F3EC);
            --porc-surface: var(--surface,   #FBF8F1);
            --porc-border:  var(--border,    #E4DDCE);
            --porc-ink:     var(--ink-1,     #1C1A17);
            --porc-ink-2:   var(--ink-2,     #6B655B);
            --porc-ink-3:   var(--ink-3,     #968B7A);
            --porc-accent:  #2D4A3E;
        }
        body { background: var(--porc-bg) !important; color: var(--porc-ink) !important; }
        select {
            background: var(--surface, #fff) !important; border: 1px solid var(--porc-border) !important;
            border-radius: 6px !important; padding: 0 12px;
            color: var(--porc-ink) !important;
            font-family: Verdana, Geneva, sans-serif !important; font-size: 13px !important;
            height: 38px;
        }
        select:focus {
            outline: none !important; border-color: var(--porc-accent) !important;
            box-shadow: 0 0 0 3px rgba(45,74,62,0.10) !important;
        }
        .page-title { color: var(--porc-ink) !important; }

        /* ── Modal (dialogs.js pencereleri için — theme.css yalnızca renk/gölge verir,
               konumlandırma her sayfada ayrı tanımlanmalı) ── */
        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(28,26,23,0.45) !important; backdrop-filter: blur(4px);
            display: flex; align-items: flex-start; justify-content: center;
            z-index: 300; padding: 1.5rem; overflow-y: auto;
        }
        .modal-backdrop.hidden { display: none; }
        .modal-content {
            background: var(--porc-surface); border: 1px solid var(--porc-border);
            border-radius: 1rem; padding: 1.5rem; width: 100%; max-width: 40rem;
            box-shadow: 0 24px 50px -12px rgba(28,26,23,0.18); margin: auto;
            color: var(--porc-ink);
            max-height: calc(100vh - 3rem); display: flex; flex-direction: column; overflow: hidden;
        }

        /* 3 sütunlu satır: Bilgi | Not | Durum/Aksiyon — her kart aynı grid-template-columns'u
           kullandığı için (ortak bir grid konteynerine gerek kalmadan) sütunlar kartlar arasında
           hizalı kalır. Bolca boşluk yerine notlar kendi sabit sütununda gösterilir. */
        .call-card {
            background: var(--surface, #fff); border: 1px solid var(--porc-border);
            border-radius: 0.75rem; margin-bottom: 10px; overflow: hidden;
            display: grid; grid-template-columns: 1.3fr 1fr 270px; align-items: stretch;
        }
        .call-card.done { background: var(--porc-surface); }
        .call-card-info { min-width: 0; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
        .call-card-note-col {
            min-width: 0; padding: 10px 20px; border-left: 1px solid var(--porc-border);
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; line-height: 1.5; color: var(--porc-ink-2);
        }
        .call-card-note-col i { color: var(--porc-accent); flex-shrink: 0; }
        .call-card-note-col.empty::after { content: '—'; color: var(--porc-border); }
        .call-card-actions {
            min-width: 0; padding: 10px 20px; border-left: 1px solid var(--porc-border);
            display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px;
        }
        .call-badge {
            display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; padding: 2px 8px; border-radius: 999px; margin-left: 8px;
        }
        .call-badge-aktif { background: #E1EEE5; color: #3D6E50; }
        .call-badge-pasif { background: #EFEAE0; color: var(--porc-ink-3); }
        .call-badge-country {
            background: transparent; border: 1px solid var(--porc-border); color: var(--porc-ink-2);
            text-transform: none; letter-spacing: 0; font-weight: 600; margin-left: 6px;
        }
        .call-badge-country i { margin-right: 4px; color: var(--porc-ink-3); }
        .btn-call-action {
            height: 30px; padding: 0 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
            cursor: pointer; border: 1px solid var(--porc-border); background: var(--porc-surface);
            color: var(--porc-ink-2); display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .btn-call-action:hover { border-color: var(--porc-accent); color: var(--porc-accent); }
        .btn-call-primary { background: var(--porc-accent); border-color: var(--porc-accent); color: #fff; }
        .btn-call-primary:hover { color: #fff; opacity: 0.9; }
        .call-done-badge { margin-left: 0 !important; }
        .section-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--porc-ink-3); margin: 22px 0 10px;
        }
        .btn-add-extra {
            width: 100%; height: 38px; margin: 4px 0 8px;
            border: 1px dashed var(--porc-border); border-radius: 8px; background: transparent;
            color: var(--porc-ink-3); font-size: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all .15s;
        }
        .btn-add-extra:hover { border-color: var(--porc-accent); color: var(--porc-accent); background: var(--surface, #fff); }

        /* ── Firma adı: geçmiş notlar panelini açar ── */
        .call-company-btn {
            background: none; border: none; padding: 0; cursor: pointer;
            font: inherit; color: inherit; text-align: left;
            border-bottom: 1px dashed transparent; transition: color .12s, border-color .12s;
        }
        .call-company-btn:hover { color: var(--porc-accent); border-bottom-color: var(--porc-accent); }

        /* ── Geçmiş Notlar paneli ── */
        .notes-panel { max-width: 46rem; }
        .notes-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
        .note-row {
            display: grid; grid-template-columns: 132px 1fr 30px; gap: 8px; align-items: start;
            padding: 10px; margin-bottom: 8px; border-radius: 8px;
            background: var(--surface, #fff); border: 1px solid var(--porc-border);
        }
        .note-row input[type="date"], .note-row textarea {
            width: 100%; box-sizing: border-box;
            border: 1px solid var(--porc-border); border-radius: 6px;
            background: var(--porc-surface); color: var(--porc-ink);
            font-family: Verdana, Geneva, sans-serif; font-size: 12px;
            padding: 6px 8px; outline: none;
        }
        .note-row textarea { resize: vertical; line-height: 1.5; }
        .note-row input:focus, .note-row textarea:focus {
            border-color: var(--porc-accent); box-shadow: 0 0 0 3px rgba(45,74,62,0.10);
        }
        .note-row[data-readonly="1"] input, .note-row[data-readonly="1"] textarea {
            background: transparent; border-color: transparent; padding-left: 0;
        }
        .btn-note-del {
            width: 28px; height: 28px; border-radius: 6px; border: 1px solid transparent;
            background: transparent; color: var(--porc-ink-3); cursor: pointer; font-size: 11px;
        }
        .btn-note-del:hover { background: #FCEAEA; border-color: #E8C9C9; color: #9F3D3D; }
        .notes-empty { padding: 28px 10px; text-align: center; font-size: 12.5px; color: var(--porc-ink-3); }
        .notes-btn {
            height: 34px; padding: 0 14px; border-radius: 8px; cursor: pointer;
            font-size: 12.5px; font-weight: 700; font-family: Verdana, Geneva, sans-serif;
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            border: 1px solid var(--porc-border); background: var(--porc-surface); color: var(--porc-ink-2);
        }
        .notes-btn:hover { border-color: var(--porc-accent); color: var(--porc-accent); }
        .notes-btn-primary { background: var(--porc-accent); border-color: var(--porc-accent); color: #fff; }
        .notes-btn-primary:hover { color: #fff; opacity: .9; }
    </style>
</head>
<body class="min-h-screen">

    <div id="navbar-target"></div>

    <main class="min-h-screen" style="margin-left:230px;padding:32px;">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-5" style="border-bottom:1px solid var(--porc-border);">
            <div>
                <h2 class="page-title text-2xl font-bold">
                    <i class="fa-solid fa-phone-volume" style="color:var(--porc-accent);"></i> Günlük Arama Listesi
                </h2>
                <p class="text-sm mt-1" style="color:var(--porc-ink-2);">Portföyünüzden bugün aranacak 3 Pasif + 2 Aktif müşteri.</p>
            </div>
            <div class="flex items-center gap-3">
                <select id="region-select">
                    <option value="">— Bölge Seçiniz —</option>
                    <option value="Avrupa">🌍 Avrupa</option>
                    <option value="Orta Doğu">🕌 Orta Doğu</option>
                    <option value="Afrika">🌍 Afrika</option>
                    <option value="Asya">🌏 Asya</option>
                </select>
            </div>
        </header>

        <div id="call-rotation-container">
            <div class="text-center py-12 rounded-xl" style="background:var(--surface,#fff);border:1px dashed var(--porc-border);">
                <i class="fa-solid fa-map-location-dot text-3xl mb-3" style="color:var(--porc-ink-3);"></i>
                <p class="text-sm" style="color:var(--porc-ink-2);">Listeyi görmek için önce bir bölge seçin.</p>
            </div>
        </div>
    </main>

    <!-- ── Müşteri Kaydını Düzenle → Geçmiş Notlar ──
         Arama listesinde firma adına tıklanınca açılır; notlara bakmak için
         Müşteri Kartları modülüne geçmek gerekmesin diye buraya taşındı. -->
    <div id="notes-modal" class="modal-backdrop hidden">
        <div class="modal-content notes-panel">
            <div class="flex items-start justify-between gap-3 border-b pb-3 mb-3" style="border-color:var(--porc-border);flex-shrink:0;">
                <div style="min-width:0;">
                    <div class="text-xs font-semibold" style="color:var(--porc-ink-3);letter-spacing:.08em;text-transform:uppercase;">
                        Müşteri Kaydını Düzenle
                    </div>
                    <h3 id="notes-modal-title" class="text-lg font-bold flex items-center gap-2 mt-1" style="color:var(--porc-ink);">
                        <i class="fa-solid fa-clock-rotate-left" style="color:var(--porc-accent);"></i>
                        <span id="notes-modal-company"></span>
                    </h3>
                    <p id="notes-modal-sub" class="text-xs mt-1" style="color:var(--porc-ink-2);"></p>
                </div>
                <button type="button" id="notes-modal-close" class="cursor-pointer" style="color:var(--porc-ink-3);">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="notes-list" class="notes-list"></div>

            <div class="flex items-center justify-between gap-3 border-t pt-4 mt-3" style="border-color:var(--porc-border);flex-shrink:0;flex-wrap:wrap;">
                <div class="flex items-center gap-2">
                    <button type="button" id="btn-note-add" class="notes-btn">
                        <i class="fa-solid fa-plus"></i> Yeni Not Ekle
                    </button>
                    <a id="link-open-customer" class="notes-btn" href="#" title="Tüm müşteri kartını aç">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Müşteri Kartı
                    </a>
                </div>
                <div class="flex items-center gap-2 ml-auto">
                    <button type="button" id="btn-notes-cancel" class="notes-btn">Kapat</button>
                    <button type="button" id="btn-notes-save" class="notes-btn notes-btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Kaydet
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/call-rotation.js"></script>
</body>
</html>
